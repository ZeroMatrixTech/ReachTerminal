name: Verify source release
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    container: ubuntu:26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install build and isolated-test dependencies
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y cmake ninja-build g++ pkg-config libpq-dev libcurl4-openssl-dev libssl-dev libxml2-dev nlohmann-json3-dev libcpp-httplib-dev python3 postgresql openssl nodejs
      - name: Build and numerical checks
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build -j2
          ctest --test-dir build --output-on-failure
          node --check frontend/app.js
          node --check frontend/release.js
          node --check frontend/gateway-session.js
          node tests/gateway_session_test.mjs
      - name: Private database and synthetic Gateway integration
        run: |
          useradd -m reachtest
          chown -R reachtest:reachtest "$GITHUB_WORKSPACE"
          runuser -u reachtest -- python3 scripts/test-isolated.py
