<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>ReachTerminal · 投资研究终端</title>
    <link rel="stylesheet" href="/style.css" />
    <script type="module" src="/app.js"></script>
  </head>
  <body>
    <div class="shell">
      <aside class="rail">
        <a class="brand" href="/" aria-label="ReachTerminal 首页"
          ><span class="brand-mark">R<span>↗</span></span
          ><span
            >REACH<span class="brand-light">TERMINAL</span
            ><small>OPEN INVESTMENT WORKSPACE</small></span
          ></a
        >
        <div class="rail-label">WORKSPACE</div>
        <nav id="nav" aria-label="工作区">
          <button data-page="overview" class="active">
            <span>◫</span> 组合总览 <kbd>1</kbd></button
          ><button data-page="research">
            <span>⌕</span> 公司研究 <kbd>2</kbd></button
          ><button data-page="valuation">
            <span>ƒ</span> 估值工作台 <kbd>3</kbd></button
          ><button data-page="risk">
            <span>◇</span> 风险与策略 <kbd>4</kbd></button
          ><button data-page="news">
            <span>≋</span> 新闻与研究 <kbd>5</kbd></button
          ><button data-page="data">
            <span>▤</span> 数据中心 <kbd>6</kbd>
          </button>
          <button data-page="hedge">
            <span>Δ</span> 衍生品对冲 <kbd>7</kbd></button
          ><button data-page="margin">
            <span>◴</span> 保证金监控 <kbd>8</kbd></button
          ><button data-page="macro">
            <span>◎</span> 宏观数据 <kbd>9</kbd>
          </button>
        </nav>
        <div class="rail-label watch-title">
          RESEARCH UNIVERSE <span id="universe-count">0</span>
        </div>
        <label class="search"
          ><span>⌕</span
          ><input
            id="search"
            placeholder="搜索公司 / 标的"
            aria-label="搜索公司"
          /><kbd>/</kbd></label
        >
        <div id="universe" class="universe"></div>
        <div class="rail-footer">
          <span class="status-dot"></span> LOCAL WORKSPACE
          <small>C++ / PostgreSQL · v0.1.0</small>
        </div>
      </aside>
      <main>
        <header class="topbar">
          <div class="breadcrumb">
            WORKSPACE <span>/</span> <strong id="page-name">组合总览</strong>
          </div>
          <div class="top-controls">
            <select
              id="symbol-picker"
              class="mobile-symbol"
              aria-label="切换研究标的"
            ></select>
            <span id="mode" class="badge">正在连接</span
            ><label
              >AS OF
              <input id="asof" type="date" aria-label="分析日期" /></label
            ><button id="refresh" class="icon-button" title="刷新数据">
              ↻
            </button>
          </div>
        </header>
        <div id="notice" role="status" class="notice hidden"></div>
        <div id="content" class="content">
          <div class="loading">正在连接本地研究服务…</div>
        </div>
        <footer class="bottom">
          <span>REACH / READ-ONLY BROKER ACCESS</span
          ><span id="foot-state">所有金额、数据日期与来源均可追溯</span
          ><span>USD BASE</span>
        </footer>
      </main>
    </div>
    <div id="toast" class="toast hidden" role="status"></div>
  </body>
</html>
